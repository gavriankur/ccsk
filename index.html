                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSK Exam Practice Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #111128;
            --bg-card: rgba(20, 20, 50, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(100, 180, 255, 0.3);
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --accent-glow: rgba(108, 99, 255, 0.15);
            --success: #00e676;
            --success-glow: rgba(0, 230, 118, 0.12);
            --danger: #ff4757;
            --danger-glow: rgba(255, 71, 87, 0.12);
            --warning: #ffa502;
            --text-primary: #f0f0f5;
            --text-secondary: #8888aa;
            --text-muted: #55557a;
            --gradient-1: linear-gradient(135deg, #6c63ff, #3b82f6);
            --gradient-2: linear-gradient(135deg, #6c63ff, #a855f7);
            --gradient-3: linear-gradient(135deg, #0ea5e9, #6c63ff);
            --shadow-card: 0 4px 30px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === ANIMATED BACKGROUND === */
        .bg-effects {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(108,99,255,0.3), transparent);
            top: -10%; left: -5%;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,0.2), transparent);
            top: 40%; right: -10%;
            animation-delay: -7s;
        }

        .bg-orb:nth-child(3) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(168,85,247,0.2), transparent);
            bottom: -5%; left: 30%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* === MAIN CONTAINER === */
        .quiz-container {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            padding: 20px;
        }

        /* === HEADER === */
        header {
            text-align: center;
            padding: 50px 0 40px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px; height: 70px;
            background: var(--gradient-2);
            border-radius: 20px;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(108,99,255,0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 10px 40px rgba(108,99,255,0.3); }
            50% { box-shadow: 0 10px 60px rgba(108,99,255,0.5); }
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #c7c7ff 50%, #6c63ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        .header-badges {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* === DOMAIN FILTER === */
        .domain-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .domain-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--bg-glass);
            color: var(--text-muted);
            border-radius: 100px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .domain-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: var(--accent-glow);
            transform: translateY(-1px);
        }

        .domain-btn.active {
            background: var(--gradient-1);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(108,99,255,0.3);
        }

        /* === SCORE BAR === */
        .score-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            position: sticky;
            top: 12px;
            z-index: 100;
        }

        .score-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .score-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .score-card span {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .score-card strong {
            font-size: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .sc-correct strong { color: var(--success); }
        .sc-wrong strong { color: var(--danger); }
        .sc-progress strong { color: var(--accent-light); }
        .sc-percent strong { color: var(--warning); }

        /* === PROGRESS BAR === */
        .progress-container {
            background: rgba(255,255,255,0.04);
            border-radius: 100px;
            height: 6px;
            margin-bottom: 35px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            border-radius: 100px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* === QUESTION CARD === */
        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .question-card:nth-child(1) { animation-delay: 0.05s; }
        .question-card:nth-child(2) { animation-delay: 0.1s; }
        .question-card:nth-child(3) { animation-delay: 0.15s; }
        .question-card:nth-child(4) { animation-delay: 0.2s; }
        .question-card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .question-card.answered-correct {
            border-color: rgba(0, 230, 118, 0.3);
            box-shadow: 0 0 30px var(--success-glow);
        }

        .question-card.answered-wrong {
            border-color: rgba(255, 71, 87, 0.3);
            box-shadow: 0 0 30px var(--danger-glow);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .question-number {
            font-size: 0.72rem;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .domain-tag {
            font-size: 0.68rem;
            background: var(--accent-glow);
            border: 1px solid rgba(108,99,255,0.2);
            color: var(--accent-light);
            padding: 4px 12px;
            border-radius: 100px;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.08rem;
            line-height: 1.75;
            margin-bottom: 24px;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* === ANSWER OPTIONS === */
        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .option-item { position: relative; }
        .option-item input[type="radio"] { display: none; }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 16px 20px;
            background: rgba(255,255,255,0.02);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.92rem;
            line-height: 1.6;
            font-weight: 450;
        }

        .option-label:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            transform: translateX(4px);
        }

        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.82rem;
            margin-right: 16px;
            flex-shrink: 0;
            transition: all 0.25s ease;
            font-family: 'JetBrains Mono', monospace;
        }

        .option-item input[type="radio"]:checked + .option-label {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .option-item input[type="radio"]:checked + .option-label .option-letter {
            background: var(--gradient-1);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(108,99,255,0.3);
        }

        .option-item.disabled .option-label {
            cursor: not-allowed;
            opacity: 0.4;
        }
        .option-item.disabled .option-label:hover {
            border-color: var(--border);
            background: rgba(255,255,255,0.02);
            transform: none;
        }

        .option-item.correct-answer .option-label {
            border-color: var(--success) !important;
            background: var(--success-glow) !important;
            opacity: 1 !important;
        }
        .option-item.correct-answer .option-label .option-letter {
            background: var(--success) !important;
            border-color: transparent !important;
            color: #000 !important;
            box-shadow: 0 4px 15px rgba(0,230,118,0.3) !important;
        }

        .option-item.wrong-answer .option-label {
            border-color: var(--danger) !important;
            background: var(--danger-glow) !important;
            opacity: 1 !important;
        }
        .option-item.wrong-answer .option-label .option-letter {
            background: var(--danger) !important;
            border-color: transparent !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(255,71,87,0.3) !important;
        }

        /* === SUBMIT BUTTON === */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-1);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before { left: 100%; }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108,99,255,0.4);
        }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn:disabled {
            background: rgba(255,255,255,0.05);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: var(--text-muted);
        }

        /* === FEEDBACK === */
        .feedback {
            display: none;
            padding: 18px 20px;
            border-radius: 14px;
            margin-top: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            font-weight: 450;
            animation: fadeInUp 0.4s ease;
        }

        .feedback.correct {
            display: block;
            background: var(--success-glow);
            border: 1px solid rgba(0, 230, 118, 0.25);
            color: #69f0ae;
        }

        .feedback.wrong {
            display: block;
            background: var(--danger-glow);
            border: 1px solid rgba(255, 71, 87, 0.25);
            color: #ff8a80;
        }

        /* === RESULTS === */
        .results-card {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            margin-top: 10px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-glow);
            animation: fadeInUp 0.5s ease;
        }

        .results-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .results-card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        .results-card .final-score {
            font-size: 4rem;
            font-weight: 900;
            margin: 20px 0;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -2px;
        }

        .final-score.excellent { color: var(--success); text-shadow: 0 0 30px var(--success-glow); }
        .final-score.good { color: var(--accent-light); text-shadow: 0 0 30px var(--accent-glow); }
        .final-score.average { color: var(--warning); }
        .final-score.poor { color: var(--danger); }

        .results-card .message {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .domain-results {
            text-align: left;
            margin: 25px 0;
        }

        .domain-results h3 {
            color: var(--accent-light);
            font-size: 0.85rem;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .domain-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .domain-result-item:hover {
            border-color: var(--border-hover);
            background: rgba(255,255,255,0.04);
        }

        .dr-bar {
            width: 100px;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 100px;
            overflow: hidden;
            margin-left: 10px;
        }

        .dr-bar-fill {
            height: 100%;
            border-radius: 100px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .restart-btn {
            padding: 16px 50px;
            background: var(--gradient-1);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108,99,255,0.4);
        }

        .shuffle-note {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 12px;
        }

        /* === RESPONSIVE === */
        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            .question-card { padding: 22px 18px; border-radius: 16px; }
            .score-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .score-card { padding: 12px; border-radius: 12px; }
            .score-card strong { font-size: 1.2rem; }
            .domain-filter { gap: 6px; }
            .domain-btn { padding: 6px 12px; font-size: 0.72rem; }
            .results-card { padding: 30px 20px; }
            .results-card .final-score { font-size: 3rem; }
            .option-label { padding: 12px 14px; font-size: 0.88rem; }
            .option-letter { min-width: 30px; height: 30px; font-size: 0.75rem; margin-right: 12px; }
        }
    </style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-effects">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-grid"></div>
</div>

<div class="quiz-container">

    <header>
        <div class="logo-icon">☁️</div>
        <h1>CCSK Exam Practice Quiz</h1>
        <p>Certificate of Cloud Security Knowledge — CSA Guidance v4, ENISA & CCM</p>
        <div class="header-badges">
            <span class="badge"><span class="dot"></span> 50 Questions</span>
            <span class="badge">All Domains</span>
            <span class="badge">80% Pass Mark</span>
        </div>
    </header>

    <div class="domain-filter" id="domainFilter"></div>

    <div class="score-bar" id="scoreBar">
        <div class="score-card sc-correct">
            <span>Correct</span>
            <strong id="correctCount">0</strong>
        </div>
        <div class="score-card sc-wrong">
            <span>Wrong</span>
            <strong id="wrongCount">0</strong>
        </div>
        <div class="score-card sc-progress">
            <span>Progress</span>
            <strong id="progressCount">0/0</strong>
        </div>
        <div class="score-card sc-percent">
            <span>Score</span>
            <strong id="percentScore">—</strong>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <div id="quizArea"></div>

    <div class="results-card" id="resultsCard">
        <div class="results-icon">🏆</div>
        <h2>Quiz Complete!</h2>
        <div class="final-score" id="finalScore"></div>
        <p class="message" id="resultsMessage"></p>
        <div class="domain-results" id="domainResults"></div>
        <button class="restart-btn" onclick="restartQuiz()">🔄 Restart Quiz</button>
        <p class="shuffle-note">Questions & answers are reshuffled each time</p>
    </div>

</div>

<script>
const quizData = [
    {
        question: "According to CSA Guidance, which cloud deployment model offers resources to the general public over the internet and is owned by a cloud provider?",
        options: ["Private Cloud", "Community Cloud", "Public Cloud", "Hybrid Cloud"],
        answer: 2,
        explanation: "A Public Cloud is provisioned for open use by the general public. It exists on the premises of the cloud provider and resources are shared among multiple tenants.",
        domain: "Cloud Architecture"
    },
    {
        question: "What is the term for the concept that the cloud customer always retains responsibility for the security of their data regardless of the service model used?",
        options: ["Shared Fate Model", "Residual Risk", "Shared Responsibility Model", "Due Diligence"],
        answer: 2,
        explanation: "The Shared Responsibility Model defines that security responsibility is shared between the cloud provider and customer. The customer always retains some level of responsibility, especially for their data.",
        domain: "Governance"
    },
    {
        question: "In the cloud service model hierarchy, which model gives the customer the MOST control over security?",
        options: ["SaaS", "PaaS", "FaaS", "IaaS"],
        answer: 3,
        explanation: "IaaS gives customers the most control as they manage everything from the operating system up, including applications, data, runtime, and middleware.",
        domain: "Cloud Architecture"
    },
    {
        question: "What does the CSA Cloud Controls Matrix (CCM) provide?",
        options: [
            "A penetration testing methodology for cloud",
            "A framework of cloud-specific security controls mapped to leading standards",
            "A cloud pricing comparison tool",
            "An incident response playbook for cloud breaches"
        ],
        answer: 1,
        explanation: "The CCM is a cybersecurity control framework for cloud computing, providing a set of controls mapped to leading standards, regulations, and best practices.",
        domain: "Compliance"
    },
    {
        question: "Which of the following BEST describes 'multitenancy' in cloud computing?",
        options: [

    let currentQuestions = [];
    let correctCount = 0;
    let wrongCount = 0;
    let answeredCount = 0;
    let domainStats = {};
    const letters = ['A', 'B', 'C', 'D'];

    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getDomains() {
        return [...new Set(quizData.map(q => q.domain))];
    }

    function buildDomainFilter() {
        const container = document.getElementById('domainFilter');
        container.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.className = 'domain-btn active';
        allBtn.textContent = `All (${quizData.length})`;
        allBtn.onclick = function() { startQuiz('all', this); };
        container.appendChild(allBtn);

        getDomains().forEach(domain => {
            const count = quizData.filter(q => q.domain === domain).length;
            const btn = document.createElement('button');
            btn.className = 'domain-btn';
            btn.textContent = `${domain} (${count})`;
            btn.onclick = function() { startQuiz(domain, this); };
            container.appendChild(btn);
        });
    }

    function startQuiz(domain, btnEl) {
        document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
        if (btnEl) btnEl.classList.add('active');

        let questions = domain === 'all' ? [...quizData] : quizData.filter(q => q.domain === domain);
        currentQuestions = shuffle(questions).map(q => {
            const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
            const shuffled = shuffle(optionsWithIndex);
            return {
                ...q,
                options: shuffled.map(o => o.text),
                answer: shuffled.findIndex(o => o.isCorrect)
            };
        });

        correctCount = 0;
        wrongCount = 0;
        answeredCount = 0;
        domainStats = {};

        document.getElementById('quizArea').innerHTML = '';
        document.getElementById('resultsCard').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';

        buildQuiz();
        updateScore();
        document.getElementById('quizArea').scrollIntoView({ behavior: 'smooth' });
    }

    function buildQuiz() {
        const quizArea = document.getElementById('quizArea');
        const total = currentQuestions.length;
        document.getElementById('progressCount').textContent = `0/${total}`;

        currentQuestions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${index}`;
            card.style.animationDelay = `${Math.min(index * 0.05, 0.5)}s`;

            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                optionsHTML += `
                    <li class="option-item" id="option-${index}-${optIdx}">
                        <input type="radio" name="question${index}" id="q${index}o${optIdx}" value="${optIdx}">
                        <label class="option-label" for="q${index}o${optIdx}">
                            <span class="option-letter">${letters[optIdx]}</span>
                            <span>${opt}</span>
                        </label>
                    </li>`;
            });

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">Question ${index + 1} of ${total}</div>
                    <span class="domain-tag">${q.domain}</span>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">${optionsHTML}</ul>
                <button class="submit-btn" id="btn-${index}" onclick="submitAnswer(${index})">Submit Answer</button>
                <div class="feedback" id="feedback-${index}"></div>`;

            quizArea.appendChild(card);
        });
    }

    function submitAnswer(qIndex) {
        const selected = document.querySelector(`input[name="question${qIndex}"]:checked`);
        if (!selected) {
            const btn = document.getElementById(`btn-${qIndex}`);
            btn.textContent = '⚠ Select an answer first!';
            btn.style.background = 'rgba(255,165,2,0.2)';
            btn.style.color = '#ffa502';
            setTimeout(() => {
                btn.textContent = 'Submit Answer';
                btn.style.background = '';
                btn.style.color = '';
            }, 1500);
            return;
        }

        const chosenIndex = parseInt(selected.value);
        const q = currentQuestions[qIndex];
        const correctIndex = q.answer;
        const feedback = document.getElementById(`feedback-${qIndex}`);
        const card = document.getElementById(`card-${qIndex}`);
        const btn = document.getElementById(`btn-${qIndex}`);

        card.querySelectorAll('.option-item').forEach(opt => opt.classList.add('disabled'));
        card.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);

        document.getElementById(`option-${qIndex}-${correctIndex}`).classList.add('correct-answer');

        if (!domainStats[q.domain]) domainStats[q.domain] = { correct: 0, total: 0 };
        domainStats[q.domain].total++;

        if (chosenIndex === correctIndex) {
            correctCount++;
            domainStats[q.domain].correct++;
            card.classList.add('answered-correct');
            feedback.className = 'feedback correct';
            feedback.innerHTML = `<strong>✅ Correct!</strong> ${q.explanation}`;
        } else {
            wrongCount++;
            document.getElementById(`option-${qIndex}-${chosenIndex}`).classList.add('wrong-answer');
            card.classList.add('answered-wrong');
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `<strong>❌ Incorrect.</strong> ${q.explanation}`;
        }

        answeredCount++;
        btn.disabled = true;
        btn.textContent = 'Answered ✓';
        updateScore();

        if (answeredCount === currentQuestions.length) {
            setTimeout(showResults, 800);
        }
    }

    function updateScore() {
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('wrongCount').textContent = wrongCount;
        document.getElementById('progressCount').textContent = `${answeredCount}/${currentQuestions.length}`;

        const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
        document.getElementById('percentScore').textContent = answeredCount > 0 ? pct + '%' : '—';

        const progressPercent = (answeredCount / currentQuestions.length) * 100;
        document.getElementById('progressBar').style.width = progressPercent + '%';
    }

    function showResults() {
        const card = document.getElementById('resultsCard');
        const scoreEl = document.getElementById('finalScore');
        const messageEl = document.getElementById('resultsMessage');
        const percent = Math.round((correctCount / currentQuestions.length) * 100);

        scoreEl.textContent = `${percent}%`;

        if (percent >= 80) {
            scoreEl.className = 'final-score excellent';
            messageEl.textContent = `Outstanding! ${correctCount}/${currentQuestions.length} correct. You're ready for the CCSK exam! (Pass mark: 80%)`;
        } else if (percent >= 70) {
            scoreEl.className = 'final-score good';
            messageEl.textContent = `Good effort! ${correctCount}/${currentQuestions.length} correct. Close to the 80% pass mark — review your weak domains.`;
        } else if (percent >= 50) {
            scoreEl.className = 'final-score average';
            messageEl.textContent = `${correctCount}/${currentQuestions.length} correct. Review the CSA Guidance and ENISA materials for the domains below.`;
        } else {
            scoreEl.className = 'final-score poor';
            messageEl.textContent = `${correctCount}/${currentQuestions.length} correct. Spend more time studying the materials before retaking.`;
        }

        const domainResultsDiv = document.getElementById('domainResults');
        domainResultsDiv.innerHTML = '<h3>📊 Performance by Domain</h3>';

        Object.keys(domainStats).sort().forEach(domain => {
            const stat = domainStats[domain];
            const dp = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
            let barColor = dp >= 80 ? 'var(--success)' : dp >= 60 ? 'var(--warning)' : 'var(--danger)';

            domainResultsDiv.innerHTML += `
                <div class="domain-result-item">
                    <span>${domain}</span>
                    <span style="display:flex;align-items:center;gap:8px;">
                        <span style="font-family:'JetBrains Mono',monospace;">${stat.correct}/${stat.total}</span>
                        <div class="dr-bar"><div class="dr-bar-fill" style="width:${dp}%;background:${barColor}"></div></div>
                        <span style="color:${barColor};font-weight:700;min-width:40px;text-align:right;font-family:'JetBrains Mono',monospace;">${dp}%</span>
                    </span>
                </div>`;
        });

        card.style.display = 'block';
        card.scrollIntoView({ behavior: 'smooth' });
    }

    function restartQuiz() {
        const activeBtn = document.querySelector('.domain-btn.active');
        if (activeBtn) activeBtn.click();
        else startQuiz('all', document.querySelector('.domain-btn'));
    }

    // Initialize
    buildDomainFilter();
    currentQuestions = shuffle([...quizData]).map(q => {
        const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        const shuffled = shuffle(optionsWithIndex);
        return { ...q, options: shuffled.map(o => o.text), answer: shuffled.findIndex(o => o.isCorrect) };
    });
    buildQuiz();
    updateScore();
</script>
